<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRED360 · Diagnóstico PRACTI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#eef4fa;font:16px Arial;color:#10253e}main{max-width:580px;margin:32px auto;padding:18px}.card{background:white;border-radius:18px;padding:22px;margin-bottom:15px;box-shadow:0 5px 24px #10253e12}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px}p{line-height:1.5;color:#496078}input,button{width:100%;padding:14px;border-radius:10px;font:inherit;margin:7px 0}input{border:1px solid #c8d4e1}button{border:0;background:#0877e8;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#123453}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf4fa;border-radius:10px;padding:12px}small{color:#53657a}.hide{display:none}</style></head><body><main><div class="card"><h1>MIRED360 · PRACTI</h1><p>Panel privado de verificación. Solo consultas: <b>no ejecuta recargas ni pagos</b>.</p></div>
<div id="login" class="card"><h2>Acceso MIRED360</h2><input id="email" type="email" autocomplete="username" placeholder="Correo del administrador"><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="enter">Ingresar</button><p id="loginmsg" role="status"></p></div>
<div id="panel" class="card hide"><h2>Diagnóstico de conexión</h2><small id="who"></small><button id="config">1. Verificar configuración</button><button id="saldo">2. Consultar saldo PRACTI</button><button id="productos">3. Consultar productos</button><button id="logout" class="secondary">Cerrar sesión</button><pre id="result" role="status">Elige una consulta. No se moverá dinero.</pre></div></main>
<script>
const URL='https://lpiusomsuswdcraoozdn.supabase.co',KEY='sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r',client=window.supabase?.createClient(URL,KEY);
const $=id=>document.getElementById(id);let busy=false;
function render(session){$('login').classList.toggle('hide',!!session);$('panel').classList.toggle('hide',!session);$('who').textContent=session?.user?.email||'';}
async function run(action){if(busy)return;busy=true;['config','saldo','productos'].forEach(id=>$(id).disabled=true);$('result').textContent='Consultando '+action+'…';try{const {data:{session}}=await client.auth.getSession();if(!session)throw Error('Sesión vencida. Inicia sesión nuevamente.');const response=await fetch(URL+'/functions/v1/practi-produccion',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({action:action==='config'?'configuracion':action})});const json=await response.json().catch(()=>({error:'Respuesta no JSON'}));if(!response.ok)throw Error('HTTP '+response.status+': '+(json.error||'Error del servicio'));const value=json.data??json;const safe=JSON.stringify(value,(k,v)=>/clave|password|token|secret|authorization|idcomercio/i.test(k)?'[oculto]':v,2);$('result').textContent=safe.slice(0,16000);}catch(e){$('result').textContent='No se completó la consulta: '+e.message;}finally{busy=false;['config','saldo','productos'].forEach(id=>$(id).disabled=false);}}
$('enter').onclick=async()=>{const btn=$('enter');btn.disabled=true;$('loginmsg').textContent='Verificando acceso…';try{if(!client)throw Error('No se cargó la conexión Supabase. Revisa tu conexión e inténtalo de nuevo.');const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';$('loginmsg').textContent='';render((await client.auth.getSession()).data.session);}catch(e){$('loginmsg').textContent='No se pudo ingresar: '+e.message;}finally{btn.disabled=false;}};
$('config').onclick=()=>run('config');$('saldo').onclick=()=>run('saldo');$('productos').onclick=()=>run('productos');$('logout').onclick=async()=>{await client.auth.signOut();render(null);};if(client){client.auth.getSession().then(({data})=>render(data.session)).catch(e=>$('loginmsg').textContent=e.message);client.auth.onAuthStateChange((_event,session)=>render(session));}else{$('loginmsg').textContent='No cargó el servicio de acceso. Pulsa Ingresar para ver el error.';}
</script></body></html>
