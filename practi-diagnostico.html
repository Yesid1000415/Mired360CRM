<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRED360 · Diagnóstico PRACTI</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef4fa;font:16px Arial;color:#10253e}main{max-width:580px;margin:32px auto;padding:18px}.card{background:white;border-radius:18px;padding:22px;margin-bottom:15px;box-shadow:0 5px 24px #10253e12}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px}p{line-height:1.5;color:#496078}input,button{width:100%;padding:14px;border-radius:10px;font:inherit;margin:7px 0}input{border:1px solid #c8d4e1}button{border:0;background:#0877e8;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#123453}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf4fa;border-radius:10px;padding:12px}small{color:#53657a}.hide{display:none}</style></head><body><main><div class="card"><h1>MIRED360 · PRACTI</h1><p>Panel privado de verificación. Solo consultas: <b>no ejecuta recargas ni pagos</b>.</p></div>
<div id="login" class="card"><h2>Acceso MIRED360</h2><input id="email" type="email" autocomplete="username" placeholder="Correo del administrador"><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="enter">Ingresar</button><p id="loginmsg" role="status"></p></div>
<div id="panel" class="card hide"><h2>Diagnóstico de conexión</h2><small id="who"></small><button id="config">1. Verificar configuración</button><button id="saldo">2. Consultar saldo PRACTI</button><button id="productos">3. Consultar productos</button><button id="logout" class="secondary">Cerrar sesión</button><pre id="result" role="status">Elige una consulta. No se moverá dinero.</pre></div></main>
<script>
(function(){
'use strict';
var base='https://lpiusomsuswdcraoozdn.supabase.co';
var key='sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r';
var token=null, busy=false;
function el(id){return document.getElementById(id)}
function show(session){el('login').classList.toggle('hide',!!session);el('panel').classList.toggle('hide',!session);el('who').textContent=session&&session.email||''}
function errorMessage(e){return e&&e.message?e.message:String(e)}
el('enter').addEventListener('click',async function(){
 var button=el('enter'),email=el('email').value.trim(),password=el('password').value;
 el('loginmsg').textContent='Botón activo. Verificando datos…';
 if(!email||!password){el('loginmsg').textContent='Escribe correo y contraseña.';return}
 button.disabled=true;
 try{
  var controller=new AbortController();var timeout=setTimeout(function(){controller.abort()},18000);
  var response;
  try{response=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({email:email,password:password}),signal:controller.signal})}finally{clearTimeout(timeout)}
  var data=await response.json().catch(function(){return {}});
  if(!response.ok)throw Error(data.msg||data.error_description||data.message||data.error||'Acceso rechazado (HTTP '+response.status+')');
  if(!data.access_token)throw Error('No se recibió sesión de acceso.');
  token=data.access_token;el('password').value='';el('loginmsg').textContent='';show({email:email});
 }catch(e){el('loginmsg').textContent='Error de acceso: '+errorMessage(e)}
 finally{button.disabled=false}
});
async function run(action){
 if(busy)return;
 if(!token){el('result').textContent='Debes ingresar primero.';return}
 busy=true;['config','saldo','productos'].forEach(function(id){el(id).disabled=true});
 el('result').textContent='Consultando '+action+'…';
 try{
  var controller=new AbortController(),timeout=setTimeout(function(){controller.abort()},25000),response;
  try{response=await fetch(base+'/functions/v1/practi-produccion',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':key},body:JSON.stringify({action:action==='config'?'configuracion':action}),signal:controller.signal})}finally{clearTimeout(timeout)}
  var data=await response.json().catch(function(){return {error:'Respuesta no JSON'}});
  if(!response.ok)throw Error('HTTP '+response.status+': '+(data.error||'No se pudo consultar'));
  el('result').textContent=JSON.stringify(data.data||data,function(k,v){return /clave|password|token|secret|authorization|idcomercio/i.test(k)?'[oculto]':v},2).slice(0,12000);
 }catch(e){el('result').textContent='Error de consulta: '+errorMessage(e)}
 finally{busy=false;['config','saldo','productos'].forEach(function(id){el(id).disabled=false})}
}
el('config').addEventListener('click',function(){run('config')});
el('saldo').addEventListener('click',function(){run('saldo')});
el('productos').addEventListener('click',function(){run('productos')});
el('logout').addEventListener('click',function(){token=null;show(null);el('result').textContent='Sin sesión.'});
show(null);
el('loginmsg').textContent='Acceso listo para verificar.';
})();
</script></body></html>
