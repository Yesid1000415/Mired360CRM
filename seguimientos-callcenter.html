<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seguimientos Call Center · MIRED360</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--n:#071a33;--n2:#0b2d52;--b:#0f7cff;--c:#00b8ff;--bg:#f4f7fb;--card:#fff;--t:#132238;--m:#6d7f94;--l:#dbe5ef;--ok:#159b65;--w:#e79a11;--d:#db454b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select,a{font:inherit}.top{background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;padding:17px 20px}.topin{max-width:1350px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand b{font-size:20px}.brand small{display:block;color:#98dcf9;margin-top:4px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:linear-gradient(135deg,var(--b),var(--c));color:#fff}.ghost{background:#fff;border:1px solid var(--l);color:#17304f}.wrap{max-width:1350px;margin:auto;padding:18px}.intro{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.intro h1{margin:0;font-size:26px}.intro p{margin:6px 0;color:var(--m)}.grid{display:grid;gap:11px}.kpis{grid-template-columns:repeat(5,1fr);margin-bottom:14px}.kpi,.card{background:#fff;border:1px solid var(--l);border-radius:17px;box-shadow:0 8px 26px #071a330c}.kpi{padding:15px}.kpi small{color:var(--m);font-weight:700}.kpi strong{display:block;font-size:29px;margin-top:7px}.card{padding:16px;margin-bottom:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{min-width:230px;flex:1}.filters input,.filters select{border:1px solid #cad8e6;border-radius:10px;padding:10px;background:#fff}.table{overflow:auto;border:1px solid var(--l);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:11px;border-bottom:1px solid var(--l);font-size:12px;text-align:left;vertical-align:top}th{background:#f1f6fb;position:sticky;top:0}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.late{background:#feecec;color:#a82d34}.today{background:#fff4dc;color:#865800}.next{background:#eaf8f1;color:#08724a}.none{background:#eef3f7;color:#607184}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.wa{background:#e9fbf2;color:#087a49;border:1px solid #bdebd5}.empty{padding:28px;text-align:center;color:var(--m)}.status{font-size:12px;color:var(--m)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.intro,.topin{flex-direction:column}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand"><b>MIRED<span style="color:#00b8ff">360</span> · Seguimientos</b><small>Control de oportunidades Call Center</small></div><div><a class="btn ghost" href="dashboard-callcenter.html">← Centro de Control</a></div></div></div>
<div class="wrap">
  <div class="intro"><div><h1>📅 Seguimientos pendientes</h1><p>Prioriza vencidos, gestiones de hoy y próximos contactos.</p></div><button class="btn primary" onclick="loadData()">↻ Actualizar</button></div>
  <div id="loading" class="card">Cargando seguimientos...</div>
  <div id="content" style="display:none">
    <div class="grid kpis" id="kpis"></div>
    <div class="card"><div class="filters"><input id="search" placeholder="Buscar cliente, teléfono o asesor..." oninput="renderRows()"><select id="filter" onchange="renderRows()"><option value="">Todos</option><option value="vencido">Vencidos</option><option value="hoy">Hoy</option><option value="proximo">Próximos</option><option value="sin_fecha">Sin fecha</option><option value="estancado">Estancados</option></select></div></div>
    <div class="card"><div class="table"><table><thead><tr><th>Prioridad</th><th>Cliente</th><th>Asesor</th><th>Estado</th><th>Próximo contacto</th><th>Última gestión</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div><div id="shown" class="status" style="margin-top:9px"></div></div>
  </div>
</div>
<script>
const SUPABASE_URL='https://lpiusomsuswdcraoozdn.supabase.co';
const SUPABASE_KEY='sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let payload={},items=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const n=v=>Number(v||0);const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
function priority(x){const t=today();if(!x.proximo_contacto)return{key:'sin_fecha',label:'Sin fecha',cls:'none'};if(x.proximo_contacto<t)return{key:'vencido',label:`Vencido ${n(x.dias_vencido)}d`,cls:'late'};if(x.proximo_contacto===t)return{key:'hoy',label:'HOY',cls:'today'};return{key:'proximo',label:'Próximo',cls:'next'}}
function isStalled(x){const ms=Date.now()-new Date(x.actualizado_en||0).getTime();return x.estado==='Interesado'&&ms>172800000&&(!x.proximo_contacto||x.proximo_contacto<=today())}
function fmt(v){if(!v)return'-';try{return new Date(v).toLocaleString('es-CO',{timeZone:'America/Bogota',dateStyle:'short',timeStyle:'short'})}catch{return String(v)}}
function renderRows(){const q=document.getElementById('search').value.toLowerCase().trim(),f=document.getElementById('filter').value;let rows=items.filter(x=>{const p=priority(x);const text=[x.nombre,x.telefono,x.asesor_nombre,x.estado].join(' ').toLowerCase();if(q&&!text.includes(q))return false;if(f==='estancado')return isStalled(x);if(f&&p.key!==f)return false;return true});document.getElementById('shown').textContent=`Mostrando ${rows.length} de ${items.length} seguimiento(s).`;document.getElementById('rows').innerHTML=rows.length?rows.map(x=>{const p=priority(x);return `<tr><td><span class="badge ${p.cls}">${esc(p.label)}</span>${isStalled(x)?'<br><span class="badge late" style="margin-top:5px">Estancado</span>':''}</td><td><b>${esc(x.nombre||'Sin nombre')}</b><br>${esc(x.telefono||'')}<br><span style="color:#6d7f94">${esc(x.resultado_detalle||'')}</span></td><td><b>${esc(x.asesor_nombre||'Sin asesor')}</b><br>Ext. ${esc(String(x.extension||'').slice(-3))}</td><td>${esc(x.estado||'')}</td><td>${esc(x.proximo_contacto||'-')}</td><td>${fmt(x.ultima_llamada||x.actualizado_en)}</td><td><div class="row-actions"><a class="btn wa" href="whatsapp-callcenter.html?telefono=${encodeURIComponent(x.telefono||'')}&nombre=${encodeURIComponent(x.nombre||'Cliente')}">💬 WhatsApp</a><a class="btn ghost" href="bases-llamadas.html">📞 Base</a></div></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No hay seguimientos con este filtro.</td></tr>'}
function render(){const t=payload.totals||{};document.getElementById('kpis').innerHTML=[['⏰ Vencidos',t.vencidos],['📍 Para hoy',t.hoy],['⏭️ Próximas 48 h',t.proximos_48h],['⚠️ Estancados',t.estancados],['📂 Abiertos',t.abiertos]].map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${n(x[1])}</strong></div>`).join('');renderRows()}
async function loadData(){document.getElementById('loading').style.display='block';try{const {data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='index.html';return}const {data:p}=await sb.from('perfiles').select('rol,activo').eq('user_id',session.user.id).maybeSingle();if(p?.activo===false||!['coordinador','administrador','admin'].includes(String(p?.rol||'').toLowerCase()))throw new Error('Acceso exclusivo para coordinación.');const {data,error}=await sb.rpc('callcenter_seguimientos_coordinacion');if(error)throw error;payload=data||{};items=payload.items||[];render();document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block'}catch(e){document.getElementById('loading').innerHTML='<b>No se pudo cargar.</b><br>'+esc(e.message||e)}}
loadData();
</script>
</body></html>
