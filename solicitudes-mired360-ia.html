<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitudes MIRED360 IA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:15px Arial,sans-serif;margin:0;background:#f4f7fb;color:#17263c}header{background:#071a33;color:white;padding:20px}main{max-width:950px;margin:auto;padding:20px}a{color:#0477c7}.panel{background:white;border:1px solid #dce6f1;border-radius:16px;padding:20px;margin:12px 0}button{background:#0877d8;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}.item{border-bottom:1px solid #e4eaf0;padding:15px 0}.item:last-child{border:0}.meta{color:#61738a;font-size:13px;margin:8px 0}.status{font-weight:bold;color:#9b5a00} .done{color:#08774b} .actions{display:flex;gap:8px;flex-wrap:wrap}input{padding:10px;border:1px solid #cdd9e6;border-radius:8px;width:100%;box-sizing:border-box}#login{max-width:430px;margin:auto}h1{font-size:23px}h2{font-size:18px}</style><link rel="stylesheet" href="mired360-modulos.css?v=20261029">
<script defer src="mired360-modulos.js?v=20261029"></script>
</head><body><header><strong>MIRED360SERVICIOS · Solicitudes de MIRED360 IA</strong></header><main><p><a href="index.html">← Volver al CRM</a></p><div class="panel" id="login"><h2>Acceso coordinador</h2><p>Inicia sesión con tu usuario del CRM.</p><input id="email" type="email" placeholder="Correo"><br><br><input id="password" type="password" placeholder="Contraseña"><br><br><button onclick="login()">Ingresar</button></div><div id="dashboard" hidden><div class="panel"><h1>Solicitudes para asesores</h1><p id="summary">Cargando...</p><button onclick="load()">Actualizar solicitudes</button><p id="msg"></p><div id="list"></div></div></div><p id="error" role="alert"></p></main><script>
const sb=supabase.createClient('https://lpiusomsuswdcraoozdn.supabase.co','sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r');
const endpoint='https://lpiusomsuswdcraoozdn.supabase.co/functions/v1/mired360-ia-solicitudes-admin';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(method='GET',body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Inicia sesión primero.');const r=await fetch(endpoint,{method,headers:{authorization:'Bearer '+session.access_token,apikey:'sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(r.status===403?'Tu usuario no tiene permiso de coordinación.':j.error||'Error del servidor');return j}
async function login(){document.getElementById('error').textContent='';const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){document.getElementById('error').textContent='Credenciales inválidas';return}load()}
async function load(){try{const d=await request();document.getElementById('login').hidden=true;document.getElementById('dashboard').hidden=false;const items=d.items||[];document.getElementById('summary').textContent=items.filter(x=>x.estado==='pendiente').length+' pendientes · '+items.length+' solicitudes recientes';document.getElementById('list').innerHTML=items.length?items.map(x=>'<div class="item"><strong>'+esc(x.telefono)+'</strong> · <span class="'+(x.estado==='atendido'?'done':'status')+'">'+esc(x.estado)+'</span><p>'+esc(x.motivo)+'</p><div class="meta">'+esc(x.ultimo_mensaje||'')+' · '+new Date(x.actualizado_en).toLocaleString('es-CO')+'</div><div class="actions"><a href="tel:+'+encodeURIComponent(x.telefono)+'">Llamar</a><a target="_blank" rel="noopener" href="https://wa.me/'+encodeURIComponent(x.telefono)+'">Abrir WhatsApp</a><button data-phone="'+esc(x.telefono)+'" data-next="'+(x.estado==='pendiente'?'atendido':'pendiente')+'">'+(x.estado==='pendiente'?'Marcar atendido':'Reabrir')+'</button></div></div>').join(''):'<p>No hay solicitudes registradas.</p>';document.querySelectorAll('button[data-phone]').forEach(b=>b.onclick=()=>change(b.dataset.phone,b.dataset.next));document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=e.message}}
async function change(telefono,estado){try{await request('POST',{telefono,estado});await load()}catch(e){document.getElementById('error').textContent=e.message}}
sb.auth.getSession().then(({data})=>{if(data.session)load()});
</script></body></html>
