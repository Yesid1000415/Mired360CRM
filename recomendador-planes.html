<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recomendador Claro | MIREDMOVIL</title><style>body{margin:0;font:16px Arial,sans-serif;background:#f4f7fb;color:#16283f}header{background:#092544;color:white;padding:22px}main{max-width:800px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0001}label{display:block;font-weight:700;margin:15px 0 6px}select,input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #c9d5e1;width:100%;box-sizing:border-box}button{background:#d90919;color:white;font-weight:700;border:0;margin-top:18px;cursor:pointer}.price{font-size:27px;font-weight:800;color:#bc0819}.muted{color:#5d6d80;font-size:14px}a{color:#0059aa}</style></head><body><header><h1>Encuentra el plan ideal</h1><p>Coordinador Asesor · MIREDMOVIL S.A.S.</p></header><main><p><a href="coordinador-asesor.html">← Volver al Coordinador Asesor</a></p><form class="card" id="form"><label for="tipo">¿Qué servicio necesita?</label><select id="tipo"><option value="internet">Solo internet</option><option value="tv">Internet y televisión</option><option value="dth">Solo televisión satelital DTH</option><option value="inalambrico">Internet inalámbrico urbano</option></select><label for="presupuesto">Presupuesto mensual máximo (COP)</label><input id="presupuesto" type="number" min="0" step="1000" placeholder="Ej.: 100000"><label for="cobertura">¿Hay cobertura FTTH o HFC?</label><select id="cobertura"><option value="desconocida">No se ha validado</option><option value="si">Sí</option><option value="no">No, es un barrio urbano sin cobertura</option></select><label for="ciudad">Ciudad (opcional)</label><input id="ciudad" maxlength="80" placeholder="Ej.: Madrid, Cundinamarca"><label for="barrio">Barrio o conjunto (opcional)</label><input id="barrio" maxlength="100" placeholder="Ej.: Centro"><button type="submit">Ver recomendación</button></form><div class="card"><label for="nombre">Tu nombre completo</label><input id="nombre" maxlength="120" placeholder="Nombre completo"><label for="telefono">Tu número de celular</label><input id="telefono" inputmode="tel" maxlength="20" placeholder="Ej.: 3001234567"><label for="sitio" style="display:none">Sitio web</label><input id="sitio" style="display:none" tabindex="-1" autocomplete="off"><label style="font-weight:normal"><input type="checkbox" id="consentimiento" style="width:auto"> Autorizo el tratamiento de mis datos para recibir información y contacto comercial sobre esta solicitud.</label><button type="button" id="guardar" style="background:#123e67">Solicitar asesoría y registrar mis datos</button><p id="guardado" class="muted" aria-live="polite">Tus datos se enviarán al equipo comercial para atender tu solicitud.</p></div><div class="card" id="resultado" aria-live="polite">Selecciona las necesidades del cliente para consultar las ofertas.</div></main><script>const $=x=>document.getElementById(x);let hogar=[],alternas=[];Promise.all([fetch('coordinador-asesor-ofertas.json').then(r=>r.json()),fetch('catalogo-dth-inalambrico.json').then(r=>r.json())]).then(([a,b])=>{hogar=a.ofertas||[];alternas=b.ofertas||[]}).catch(()=>$('resultado').textContent='No fue posible cargar las ofertas. Intenta actualizar la página.');$('form').addEventListener('submit',e=>{e.preventDefault();const tipo=$('tipo').value,cob=$('cobertura').value,p=Number($('presupuesto').value)||Infinity;const root=$('resultado');root.replaceChildren();const aviso=document.createElement('p');aviso.className='muted';aviso.textContent='Recomendación orientativa. Validar cobertura, vigencia y condiciones antes de solicitar instalación.';root.append(aviso);if((tipo==='internet'||tipo==='tv')&&cob==='no'){const msg=document.createElement('p');msg.textContent='No se recomienda confirmar un plan por cable sin cobertura. Para un barrio urbano, consulta internet inalámbrico; si necesita televisión, consulta DTH.';root.append(msg);return}if(tipo==='inalambrico'&&cob==='si'){const msg=document.createElement('p');msg.textContent='Hay cobertura de red fija: compara primero las ofertas FTTH/HFC. El inalámbrico se dirige a barrios urbanos sin esa cobertura.';root.append(msg);return}let a=(tipo==='internet'?hogar.filter(o=>o.tipo==='Solo internet'):tipo==='tv'?hogar.filter(o=>o.tipo.includes('TV')):alternas.filter(o=>tipo==='dth'?o.id.startsWith('dth'):o.id==='inalambrico')).filter(o=>(o.precio||o.mensualidad)<=p).sort((x,y)=>(x.precio||x.mensualidad)-(y.precio||y.mensualidad));if(!a.length){const msg=document.createElement('p');msg.textContent='No hay ofertas dentro de ese presupuesto en el catálogo.';root.append(msg);return}for(const o of a.slice(0,4)){const h=document.createElement('h3');h.textContent=o.tipo||o.categoria;const v=document.createElement('p');v.className='price';v.textContent='$'+Number(o.precio||o.mensualidad).toLocaleString('es-CO')+'/mes';const d=document.createElement('p');d.textContent=o.megas?o.megas+' megas':o.descripcion||o.segmento||'';root.append(h,v,d)}const link=document.createElement("a");const params=new URLSearchParams({text:"Hola, solicito asesoría sobre "+document.getElementById("tipo").selectedOptions[0].text+". Ciudad: "+document.getElementById("ciudad").value+". Barrio: "+document.getElementById("barrio").value+". Favor validar cobertura."});link.href="https://wa.me/573229432085?"+params.toString();link.target="_blank";link.rel="noopener";link.textContent="Solicitar asesoría por WhatsApp";root.append(link);});</script><script>
document.getElementById('guardar').addEventListener('click',async()=>{
 const status=document.getElementById('guardado'),button=document.getElementById('guardar');
 const nombre=document.getElementById('nombre').value.trim(),telefono=document.getElementById('telefono').value.replace(/\D/g,'');
 const ciudad=document.getElementById('ciudad').value.trim(),barrio=document.getElementById('barrio').value.trim();
 const consentimiento=document.getElementById('consentimiento').checked;
 if(nombre.length<3||!/^3\d{9}$/.test(telefono)||!ciudad||!barrio||!consentimiento){status.textContent='Completa nombre, celular colombiano, ciudad, barrio y autorización.';return}
 button.disabled=true;status.textContent='Registrando solicitud…';
 try{
  const response=await fetch('https://lpiusomsuswdcraoozdn.supabase.co/functions/v1/captar-prospecto-recomendador',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,telefono,ciudad,barrio,consentimiento,sitio:document.getElementById('sitio').value,producto:document.getElementById('tipo').selectedOptions[0].text,presupuesto:document.getElementById('presupuesto').value,cobertura:document.getElementById('cobertura').selectedOptions[0].text,campana:new URLSearchParams(location.search).get('utm_campaign')||'Recomendador'})});
  const data=await response.json();
  status.textContent=response.ok&&data.ok?(data.duplicado?'Ya recibimos tu solicitud. Te contactaremos.':'¡Solicitud registrada! Nuestro equipo te contactará.'):(data.error||'No fue posible registrar la solicitud.');
 }catch{status.textContent='No fue posible enviar tu solicitud. Inténtalo nuevamente o escríbenos por WhatsApp.'}
 finally{button.disabled=false}
});
</script></body></html>
