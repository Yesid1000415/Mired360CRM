<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIRED Call Center · Usuarios</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#f5f8fc;color:#132238}.wrap{max-width:900px;margin:30px auto;padding:0 15px}.card{background:#fff;border:1px solid #dce6f1;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 10px 30px #0423420c}.head{background:#071a33;color:#fff;padding:20px}.head b{font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:grid;gap:6px;font-size:12px;font-weight:700}input{padding:11px;border:1px solid #cfdceb;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#0f7cff;color:#fff}.ghost{background:#fff;border:1px solid #dce6f1}.msg{margin-top:10px;font-size:13px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px;border-bottom:1px solid #dce6f1;text-align:left;font-size:13px}th{background:#f2f7fc}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="head"><div class="wrap" style="margin:0 auto;padding:0 15px"><b>MIRED CALL EN CASA · Nueva Fuerza Comercial</b></div></div><main class="wrap"><div class="card"><h2>Crear asesor Call Center</h2><p>Este usuario tendrá acceso normal como asesor al CRM, pero quedará identificado en el grupo <b>Call Center</b>.</p><div class="grid"><label class="full">Nombre y apellidos<input id="nombre"></label><label>Correo<input id="email" type="email"></label><label>Contraseña temporal<input id="password" type="text" minlength="8"></label><div class="full"><button class="btn primary" id="crear">Crear usuario Call Center</button> <button class="btn ghost" onclick="location.href='index.html'">Volver al CRM</button></div></div><div id="msg" class="msg"></div></div><div class="card"><h2>Usuarios Call Center</h2><div class="table"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Grupo</th><th>Creación</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const URL='https://lpiusomsuswdcraoozdn.supabase.co',KEY='sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r',c=supabase.createClient(URL,KEY),CREATE=URL+'/functions/v1/crear-asesor-v3';let me=null;async function init(){const {data:{session}}=await c.auth.getSession();if(!session)return location.href='index.html';me=session.user;const {data:p}=await c.from('perfiles').select('rol').eq('user_id',me.id).single();if(!p||!['coordinador','administrador'].includes(p.rol)){alert('Acceso exclusivo para coordinación.');return location.href='index.html'}load()}async function load(){const {data,error}=await c.from('perfiles').select('nombre,email,rol,grupo,creado_en').eq('grupo','callcenter').order('creado_en',{ascending:false});rows.innerHTML=error?'<tr><td colspan="5">'+error.message+'</td></tr>':(data||[]).map(x=>'<tr><td>'+x.nombre+'</td><td>'+x.email+'</td><td>'+x.rol+'</td><td>'+x.grupo+'</td><td>'+new Date(x.creado_en).toLocaleString('es-CO')+'</td></tr>').join('')||'<tr><td colspan="5">Aún no hay asesores Call Center.</td></tr>'}crear.onclick=async()=>{let n=nombre.value.trim(),e=email.value.trim().toLowerCase(),p=password.value;if(!n||!e||p.length<8){msg.textContent='Complete nombre, correo y una contraseña de mínimo 8 caracteres.';return}crear.disabled=true;msg.textContent='Creando...';try{const {data:{session}}=await c.auth.getSession();const r=await fetch(CREATE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({nombre:n,email:e,password:p,grupo:'callcenter'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No fue posible crear el usuario.');msg.textContent='Usuario Call Center creado correctamente.';nombre.value=email.value=password.value='';await load()}catch(x){msg.textContent=x.message}finally{crear.disabled=false}};init()</script></body></html>
