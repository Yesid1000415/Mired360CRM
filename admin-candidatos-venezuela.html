<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidatos Venezuela | MIRED360</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef3f8;color:#17263a}.top{background:#081d34;color:white;padding:20px}.top h1{margin:0;font-size:23px}.wrap{max-width:1200px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 5px 18px #16324f12}.stat b{font-size:25px;color:#0d5c96}.tools{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}input,select{padding:10px;border:1px solid #cbd6e1;border-radius:9px;background:white}.tools input{flex:1;min-width:220px}.candidate{margin:11px 0}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:800;font-size:17px}.meta{color:#63758a;font-size:13px;margin-top:4px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px;font-size:14px}.box{background:#f7f9fc;padding:10px;border-radius:9px}.state{font-weight:700}.err{padding:25px;text-align:center;color:#a32222}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><h1>🇻🇪 Candidatos Venezuela</h1><div style="opacity:.8;margin-top:5px">Panel privado · MIRED360 CALL EN CASA</div></header><main class="wrap"><div id="gate" class="card">Validando acceso administrativo...</div><div id="app" hidden><div class="stats"><div class="stat"><b id="total">0</b><div>Total</div></div><div class="stat"><b id="new">0</b><div>Nuevos</div></div><div class="stat"><b id="training">0</b><div>Capacitación</div></div><div class="stat"><b id="active">0</b><div>Activos</div></div></div><div class="tools"><input id="q" placeholder="Buscar por nombre, documento o teléfono"><select id="filter"><option value="">Todos los estados</option><option>Nuevo</option><option>Contactado</option><option>Capacitación</option><option>Aprobado</option><option>Activo</option><option>No seleccionado</option></select></div><div id="list"></div></div></main><script>const sb=supabase.createClient('https://lpiusomsuswdcraoozdn.supabase.co','sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r'),$=x=>document.getElementById(x);let rows=[];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){$('gate').innerHTML='<b>Acceso privado.</b><br>Inicia sesión primero en el CRM administrativo y vuelve a abrir este enlace.';return}const {data:p}=await sb.from('perfiles').select('rol').eq('user_id',session.user.id).maybeSingle();if(!p||!['admin','administrador','coordinador'].includes(String(p.rol||'').toLowerCase())){$('gate').textContent='Este usuario no tiene permisos para administrar candidatos.';return}$('gate').hidden=true;$('app').hidden=false;await load()}async function load(){const {data,error}=await sb.from('candidatos_callcenter').select('*').order('creado_en',{ascending:false});if(error){$('list').innerHTML='<div class="err">No fue posible cargar los candidatos.</div>';return}rows=data||[];render()}function render(){const q=$('q').value.toLowerCase(),f=$('filter').value;const a=rows.filter(x=>(!f||x.estado===f)&&(!q||[x.nombres_apellidos,x.documento,x.telefono].join(' ').toLowerCase().includes(q)));$('total').textContent=rows.length;$('new').textContent=rows.filter(x=>x.estado==='Nuevo').length;$('training').textContent=rows.filter(x=>x.estado==='Capacitación').length;$('active').textContent=rows.filter(x=>x.estado==='Activo').length;$('list').innerHTML=a.map(x=>'<section class="card candidate"><div class="head"><div><div class="name">'+esc(x.nombres_apellidos)+'</div><div class="meta">'+esc(x.ciudad_estado)+' · '+esc(x.telefono)+' · '+esc(x.correo)+'</div></div><select class="state" onchange="state('+x.id+',this.value)">'+['Nuevo','Contactado','Capacitación','Aprobado','Activo','No seleccionado'].map(s=>'<option '+(x.estado===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="details"><div class="box"><b>Documento</b><br>'+esc(x.documento)+'<br><br><b>Ventas telefónicas:</b> '+(x.experiencia_ventas_telefonicas?'Sí':'No')+'<br><b>Call Center:</b> '+(x.experiencia_callcenter?'Sí':'No')+'<br><b>Telecom:</b> '+(x.experiencia_telecom?'Sí':'No')+'</div><div class="box"><b>Experiencia</b><br>'+esc(x.area_experiencia||'No especificada')+'<br><br><b>Disponibilidad:</b> '+esc(x.horas_dia)+' · '+esc(x.horario)+'<br>'+esc(x.dias_disponibles)+'</div><div class="box"><b>Herramientas</b><br>PC: '+(x.computador?'✓':'—')+' · Internet: '+(x.internet_estable?'✓':'—')+' · Diadema: '+(x.diadema?'✓':'—')+'<br>Smartphone: '+(x.smartphone?'✓':'—')+' · Espacio: '+(x.espacio_adecuado?'✓':'—')+'<br><br><b>Pago:</b> '+esc(x.entidad_pago)+' · '+esc(x.titular_pago)+'<br><b>Comisión:</b> US$30</div></div></section>').join('')||'<div class="card">No hay candidatos con este filtro.</div>'}async function state(id,estado){const {error}=await sb.from('candidatos_callcenter').update({estado}).eq('id',id);if(error){alert('No fue posible actualizar el estado.');await load();return}const x=rows.find(r=>r.id===id);if(x)x.estado=estado;render()}$('q').addEventListener('input',render);$('filter').addEventListener('change',render);init();</script></body></html>
