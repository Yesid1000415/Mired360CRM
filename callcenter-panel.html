<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRED Call en Casa · Panel del asesor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--n:#071a33;--n2:#0b2d52;--c:#00b8ff;--b:#0f7cff;--bg:#f5f8fc;--card:#fff;--t:#132238;--m:#708199;--l:#dce6f1;--ok:#16a36a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}button{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:linear-gradient(180deg,var(--n),#061426);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;margin-bottom:22px}.logo{width:44px;height:44px;border:2px solid var(--c);border-radius:14px;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#7fdfff;letter-spacing:1.2px;margin-top:3px}.profile{padding:12px;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:13px;margin-bottom:14px}.profile b,.profile small{display:block}.profile small{color:#a8bfd6;margin-top:4px}.nav{display:grid;gap:6px;max-height:calc(100vh - 205px);overflow:auto}.nav button{width:100%;border:0;background:transparent;color:#d4e2ef;text-align:left;padding:13px;border-radius:12px;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:rgba(0,184,255,.16);color:#fff}.side-footer{position:absolute;left:14px;right:14px;bottom:18px}.logout{width:100%;border:1px solid #ffffff33;background:transparent;color:#fff;padding:10px;border-radius:11px;cursor:pointer}.main{min-width:0;display:flex;flex-direction:column;height:100vh}.top{padding:17px 20px;background:#fff;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:10px;align-items:center}.top h1{font-size:20px;margin:0}.top p{margin:4px 0 0;color:var(--m);font-size:12px}.status{font-size:12px;color:var(--ok);font-weight:700}.frame{flex:1;width:100%;border:0;background:var(--bg)}.loading{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20}.loading .box{background:#fff;border:1px solid var(--l);border-radius:18px;padding:24px;text-align:center;box-shadow:0 15px 40px #071a3315}.denied{color:#b4232d}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:12px}.brand,.profile,.side-footer{display:none}.nav{display:flex;overflow:auto;max-height:none}.nav button{width:auto;white-space:nowrap}.main{height:calc(100vh - 58px)}.top{padding:12px}.top p{display:none}}
.office-card{border:1px solid var(--l);background:#fff;border-radius:16px;padding:18px;text-align:left;cursor:pointer;display:grid;gap:8px;font-size:25px;box-shadow:0 8px 25px #071a330a}.office-card b{font-size:15px;color:var(--n2)}.office-card span{font-size:12px;color:var(--m);line-height:1.4}.office-card:hover{border-color:#9fdcff;transform:translateY(-1px)}
</style>
</head>
<body>
<div id="loading" class="loading"><div class="box"><b>MIRED Call en Casa</b><div style="margin-top:7px;color:#708199">Validando acceso...</div></div></div>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">M</div><div><b>MIRED<span style="color:#00b8ff">360</span></b><small>CALL EN CASA</small></div></div>
  <div class="profile"><b id="profileName">Asesor</b><small id="profileRole">Equipo Call Center</small></div>
  <div class="nav">
    <button id="navHome" class="active" onclick="openModule('inicio')">🏠 Mi oficina</button>
    <button id="navBases" class="active" onclick="openModule('bases')">📞 Bases de llamadas</button>
    <button id="navWa" onclick="openModule('whatsapp')">💬 WhatsApp</button>
    <button id="navSupport" onclick="openModule('soporte')">📍 Validar dirección / Soporte</button>
    <button onclick="openModule('red')" id="navRed">🌎 Red comercial / Telegram</button>
    <button id="navSale" onclick="openModule('venta')">🧾 Subir venta</button>
    <button id="navClaims" onclick="openModule('comisiones')">💰 Cobro de comisiones</button>
    <button id="navPerf" onclick="openModule('rendimiento')">🚦 Mi rendimiento</button>
    <button id="navQuality" onclick="openModule('calidad')">⭐ Calidad</button>
    <button id="navAcademia" onclick="openModule('academia')">🎓 Academia</button>
  </div>
  <div class="side-footer"><button class="logout" style="margin-bottom:8px" onclick="changePassword()">🔐 Cambiar contraseña</button><button class="logout" onclick="logout()">Cerrar sesión</button></div>
</aside>
<section class="main">
  <div class="top"><div><h1 id="moduleTitle">🏠 Mi oficina Call Center</h1><p id="moduleSubtitle">Todo tu trabajo diario en un solo lugar.</p></div><div class="status">● Conectado</div></div>
  <div id="officeHome" class="frame" style="padding:22px;overflow:auto">
    <div style="max-width:1050px;margin:auto">
      <section style="background:linear-gradient(135deg,#071a33,#0b4f83);color:white;border-radius:20px;padding:25px;margin-bottom:16px"><h2 style="margin:0 0 7px">Tu oficina MIRED Call Center</h2><p style="margin:0;color:#cbeaff">Aquí encuentras todo lo necesario para gestionar tu jornada sin salir del panel.</p></section>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px">
        <button class="office-card" onclick="openModule('bases')">📞<b>Bases y llamadas</b><span>Gestiona tus contactos asignados.</span></button>
        <button class="office-card" onclick="openModule('whatsapp')">💬<b>WhatsApp</b><span>Atiende tus conversaciones.</span></button>
        <button class="office-card" onclick="openModule('soporte')">📍<b>Soporte y validación</b><span>Accede al canal de validaciones.</span></button>
        <button class="office-card" onclick="openModule('venta')">🧾<b>Ingreso de venta</b><span>Registra la venta para auditoría por llamada.</span></button>
        <button class="office-card" onclick="openModule('comisiones')">💰<b>Comisiones</b><span>Consulta y solicita tus pagos.</span></button>
        <button class="office-card" onclick="openModule('rendimiento')">🚦<b>Mi rendimiento</b><span>Revisa tu avance comercial.</span></button>
        <button class="office-card" onclick="openModule('calidad')">⭐<b>Calidad</b><span>Consulta retroalimentación.</span></button>
        <button class="office-card" onclick="openModule('academia')">🎓<b>Academia</b><span>Capacitación y evaluación.</span></button>
        <button class="office-card" onclick="openModule('red')">🌎<b>Telegram y avisos</b><span>Información para Colombia y Venezuela.</span></button>
      </div>
    </div>
  </div>
  <iframe id="moduleFrame" class="frame" title="Módulo Call Center" style="display:none"></iframe>
</section>
</div>
<script>
const SUPABASE_URL='https://lpiusomsuswdcraoozdn.supabase.co';
const SUPABASE_KEY='sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SUPPORT_GROUP='https://chat.whatsapp.com/H0CwFWhVDe8JmWCfL7WoEA';
const modules={
  inicio:{url:null,title:'🏠 Mi oficina Call Center',sub:'Todo tu trabajo diario en un solo lugar.'},
  soporte:{url:null,title:'📍 Validar dirección / Soporte',sub:'Canal oficial para validaciones y soporte de la operación.'},
  red:{url:'red-comercial.html',title:'🌎 Red comercial',sub:'Perfil, clientes propios, soporte y avisos para Colombia y Venezuela.'},
  bases:{url:'bases-llamadas.html?v=20260928-3',title:'📞 Bases de llamadas',sub:'Gestiona únicamente la base que te fue asignada.'},
  whatsapp:{url:'whatsapp-callcenter.html?v=1',title:'💬 WhatsApp Call Center',sub:'Continúa la asesoría con tus propios clientes asignados.'},
  venta:{url:'autorizacion.html?v=20261001-venta-agil1',title:'🧾 Ingreso de venta',sub:'Registra los datos validados del cliente. La auditoría se realiza posteriormente por llamada.'},
  comisiones:{url:'cobro-comisiones.html?v=20261001-syntaxfix6',title:'💰 Cobro de comisiones',sub:'Colombia: $100.000 COP. Venezuela: equivalente en USD de $100.000 COP por acceso instalado y auditado.'},
  rendimiento:{url:'rendimiento.html?v=20260928-1',title:'🚦 Mi rendimiento',sub:'Consulta tus ventas, meta mensual y avance.'},
  calidad:{url:'calidad-callcenter.html?v=20260928-1',title:'⭐ Calidad Call Center',sub:'Retroalimentación y motivos de pérdida.'},
  academia:{url:'academia-callcenter-v2.html?v=20260928-3',title:'🎓 Academia Call Center',sub:'Capacitación, progreso y evaluación final.'}
};
let current='inicio',viewerRole='',viewerIsAdvisor=false,viewerName='';
const frame=document.getElementById('moduleFrame');
function setActive(key){
  const m=modules[key];if(!m)return;current=key;
  document.getElementById('moduleTitle').textContent=m.title;
  document.getElementById('moduleSubtitle').textContent=m.sub;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  const ids={inicio:'navHome',soporte:'navSupport',red:'navRed',bases:'navBases',whatsapp:'navWa',venta:'navSale',comisiones:'navClaims',rendimiento:'navPerf',calidad:'navQuality',academia:'navAcademia'};
  document.getElementById(ids[key])?.classList.add('active');
}
function openModule(key){const m=modules[key];if(!m)return;setActive(key);const home=document.getElementById('officeHome');if(key==='inicio'){frame.style.display='none';home.style.display='block';return}home.style.display='none';frame.style.display='block';if(key==='soporte'){frame.src='callcenter-soporte.html?v=20261001-1';return}frame.src=m.url}
function openSupport(){openModule('soporte')}
function openMicroSip(phone,name){
  const raw=String(phone||'').replace(/\D/g,'');
  const tel=raw.startsWith('57')&&raw.length===12?raw:(raw.length===10?'57'+raw:raw);
  if(!tel){alert('Este cliente no tiene un número válido para llamar.');return}
  // MicroSIP registra el protocolo SIP en Windows. Esto abre la app instalada
  // y entrega el número al marcador sin sacar al asesor del flujo del CRM.
  location.href='sip:'+encodeURIComponent(tel);
}
function openWhatsappFor(phone,name){
  setActive('whatsapp');
  frame.src='whatsapp-callcenter.html?v=1&telefono='+encodeURIComponent(phone||'')+'&nombre='+encodeURIComponent(name||'Cliente');
}
async function saveLossReason(id,estado,reason,detail){
  const {data,error:readError}=await sb.from('contactos_base_llamadas').select('estado').eq('id',id).maybeSingle();
  if(readError||data?.estado!==estado)return;
  const patch=['No interesado','Número incorrecto'].includes(estado)
    ?{motivo_perdida:reason,motivo_perdida_detalle:detail||null,actualizado_en:new Date().toISOString()}
    :{motivo_perdida:null,motivo_perdida_detalle:null,actualizado_en:new Date().toISOString()};
  const {error}=await sb.from('contactos_base_llamadas').update(patch).eq('id',id);
  if(error)alert('El estado se guardó, pero no fue posible guardar el motivo de pérdida. '+error.message);
}
function wrapLossReason(w){
  if(w.__miredLossReasonWrapped||typeof w.quickStatus!=='function')return;
  const original=w.quickStatus;
  w.quickStatus=async function(id,estado){
    let reason=null,detail=null;
    if(estado==='No interesado'){
      const choice=w.prompt('Selecciona el motivo de pérdida:\n\n1. Precio\n2. Ya tiene operador\n3. No quiere cambiar de operador\n4. Mala experiencia con Claro\n5. No necesita el servicio\n6. No tiene cobertura\n7. No es titular / no decide\n8. Otro\n\nEscribe el número:','');
      if(choice===null){setTimeout(()=>w.renderContacts?.(),0);return}
      const reasons={'1':'Precio','2':'Ya tiene operador','3':'No quiere cambiar de operador','4':'Mala experiencia con Claro','5':'No necesita el servicio','6':'No tiene cobertura','7':'No es titular / no decide','8':'Otro'};
      reason=reasons[String(choice).trim()];
      if(!reason){w.alert('Debes seleccionar un motivo válido del 1 al 8.');setTimeout(()=>w.renderContacts?.(),0);return}
      if(reason==='Otro'){
        detail=w.prompt('Describe brevemente el motivo:','');
        if(!String(detail||'').trim()){w.alert('Para “Otro” debes escribir el motivo.');setTimeout(()=>w.renderContacts?.(),0);return}
        detail=String(detail).trim();
      }
    }else if(estado==='Número incorrecto') reason='Número incorrecto';
    await original.apply(this,arguments);
    await saveLossReason(id,estado,reason,detail);
  };
  w.__miredLossReasonWrapped=true;
}
function cleanEmbeddedPage(){
  try{
    const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;
    [...d.querySelectorAll('a,button')].forEach(el=>{const t=String(el.textContent||'').trim().toLowerCase();const href=String(el.getAttribute?.('href')||'').toLowerCase();if(t.includes('volver al crm')||t.includes('portal de asesores')||t==='coordinación'||href==='index.html'||href==='asesores.html')el.style.display='none'});
    [...d.querySelectorAll('button,a')].forEach(el=>{
      const t=String(el.textContent||'').trim().toLowerCase();
      if(t.includes('volver al crm')||t.includes('← control')||t.includes('portal de asesores'))el.style.display='none';
    });
    if(current==='venta'&&viewerIsAdvisor){
      const adv=d.getElementById('advisor');if(adv&&!adv.value){adv.value=viewerName;adv.readOnly=true}
    }
    if(current==='comisiones'&&viewerIsAdvisor){
      const adv=d.getElementById('advisorName');if(adv&&!adv.value){adv.value=viewerName;adv.readOnly=true}
    }
    if(current==='bases'){
      const side=d.querySelector('aside.side');if(side)side.style.display='none';
      const app=d.querySelector('.app');if(app)app.style.gridTemplateColumns='1fr';
      const top=d.querySelector('main > .top');if(top)top.style.display='none';
      const main=d.querySelector('main');if(main){main.style.maxWidth='none';main.style.padding='14px'}
      if(viewerIsAdvisor){
        const toolbar=d.querySelector('main > .top .toolbar');if(toolbar)toolbar.style.display='none';
        const ext=d.getElementById('extensionSelect');if(ext){ext.disabled=true;ext.closest('label')?.classList.add('cc-readonly')}
        const adv=d.getElementById('advisorName');if(adv){adv.disabled=true;adv.closest('label')?.classList.add('cc-readonly')}
        const notice=d.querySelector('.notice');if(notice)notice.style.display='none';
        const style=d.createElement('style');style.textContent='.basebar{grid-template-columns:2fr 1fr!important}.cc-readonly{display:none!important}';d.head.appendChild(style);
      }
      wrapLossReason(w);
      const addWhatsButtons=()=>{
        const rows=[...d.querySelectorAll('tbody#rows tr[id^="row-"]')];
        rows.forEach(row=>{
          const actions=row.querySelector('.row-actions');if(!actions||actions.querySelector('[data-callcenter-wa]'))return;
          const phoneCell=row.children[1],nameCell=row.children[0];if(!phoneCell)return;
          const btn=d.createElement('button');btn.type='button';btn.className='btn ghost';btn.dataset.callcenterWa='1';btn.textContent='💬 WhatsApp';
          btn.onclick=()=>openWhatsappFor(phoneCell.textContent.trim(),nameCell?.querySelector('b')?.textContent||'Cliente');
          const pc=d.createElement('button');pc.type='button';pc.className='btn ghost';pc.dataset.callcenterMicrosip='1';pc.textContent='💻 MicroSIP';
          pc.title='Llamar desde este computador con MicroSIP';
          pc.onclick=()=>openMicroSip(phoneCell.textContent.trim(),nameCell?.querySelector('b')?.textContent||'Cliente');
          const callBtn=actions.querySelector('button');
          if(callBtn){callBtn.insertAdjacentElement('afterend',pc);pc.insertAdjacentElement('afterend',btn)}else{actions.prepend(btn);actions.prepend(pc)}
        });
      };
      if(!w.__miredCallCenterRenderWrapped&&typeof w.renderContacts==='function'){
        const originalRender=w.renderContacts;
        w.renderContacts=function(){const r=originalRender.apply(this,arguments);setTimeout(addWhatsButtons,0);return r};
        w.__miredCallCenterRenderWrapped=true;
      }
      addWhatsButtons();setTimeout(addWhatsButtons,500);setTimeout(addWhatsButtons,1400);
    }
  }catch(e){console.warn('No se pudo ajustar el módulo incrustado',e)}
}
window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.data?.type!=='MIRED360_REQUEST_SESSION'||!frame.contentWindow)return;try{const {data:{session}}=await sb.auth.getSession();if(session?.access_token)frame.contentWindow.postMessage({type:'MIRED360_SESSION',access_token:session.access_token,refresh_token:session.refresh_token},location.origin)}catch(err){console.warn('No se pudo responder la solicitud de sesión',err)}});
frame.addEventListener('load',async()=>{setTimeout(cleanEmbeddedPage,80);setTimeout(cleanEmbeddedPage,600);if(current==='comisiones'){try{const {data:{session}}=await sb.auth.getSession();if(session?.access_token&&frame.contentWindow)frame.contentWindow.postMessage({type:'MIRED360_SESSION',access_token:session.access_token,refresh_token:session.refresh_token},location.origin)}catch(e){console.warn('No se pudo transferir la sesión a comisiones',e)}}});
async function changePassword(){
  const password=prompt('Escribe tu nueva contraseña (mínimo 8 caracteres):');
  if(password===null)return;
  if(password.length<8){alert('La contraseña debe tener mínimo 8 caracteres.');return}
  const confirmPassword=prompt('Confirma la nueva contraseña:');
  if(confirmPassword===null)return;
  if(password!==confirmPassword){alert('Las contraseñas no coinciden. Intenta nuevamente.');return}
  const {error}=await sb.auth.updateUser({password});
  if(error){alert('No fue posible cambiar la contraseña. '+error.message);return}
  alert('Contraseña actualizada correctamente.');
}
async function logout(){await sb.auth.signOut();location.href='index.html'}
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session?.user){location.href='index.html';return}
  const {data:p,error}=await sb.from('perfiles').select('nombre,rol,grupo,activo').eq('user_id',session.user.id).maybeSingle();
  viewerRole=String(p?.rol||'').toLowerCase();viewerIsAdvisor=viewerRole==='asesor'&&p?.grupo==='callcenter';viewerName=p?.nombre||session.user.email||'Asesor';
  const allowed=p?.activo!==false&&(viewerIsAdvisor||viewerRole==='coordinador'||viewerRole==='administrador'||viewerRole==='admin');
  if(error||!allowed){document.getElementById('loading').innerHTML='<div class="box denied"><b>Acceso no autorizado</b><div style="margin-top:8px">Este panel es exclusivo del proyecto Call Center.</div></div>';return}
  document.getElementById('profileName').textContent=viewerName;
  document.getElementById('profileRole').textContent=viewerIsAdvisor?'Asesor · Call Center':'Coordinación · Call Center';
  document.getElementById('loading').style.display='none';
  openModule('inicio');
}
init();
</script>
</body>
</html>
