<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRED Call Center · Crear asesores</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--n:#071a33;--b:#0f7cff;--c:#00b8ff;--bg:#f5f8fc;--t:#132238;--m:#60738a;--l:#dce6f1;--ok:#08774b;--danger:#b4232d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}.top{background:linear-gradient(135deg,var(--n),#0b2d52);color:#fff;padding:20px}.topin{max-width:960px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:20px}.sub{font-size:12px;color:#b9dbf3;margin-top:4px}.wrap{max-width:960px;margin:24px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(4,35,66,.06)}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#52647a}input{width:100%;padding:12px;border:1px solid #cfdceb;border-radius:11px;font-size:15px}.pass{display:flex;gap:8px}.pass input{flex:1}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--b),var(--c));color:#fff}.ghost{background:#fff;border:1px solid var(--l);color:var(--t)}.btn:disabled{opacity:.55;cursor:not-allowed}.notice{padding:12px;border-radius:12px;background:#eef8ff;border:1px solid #c6eaff;color:#27577a;font-size:13px}.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:13px;font-weight:800;white-space:pre-wrap}.msg.show{display:block}.msg.info{background:#eef6ff;color:#0756a6;border:1px solid #bdd8f7}.msg.ok{background:#eaf8f1;color:var(--ok);border:1px solid #bdebd5}.msg.error{background:#fff1f2;color:var(--danger);border:1px solid #fecdd3}.cred{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#f2fbf7;border:1px solid #bdebd5}.cred.show{display:block}.cred code{display:block;background:#fff;border:1px solid var(--l);padding:9px;border-radius:8px;margin:7px 0;overflow:auto}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}th{background:#f2f7fc}.hint{font-size:12px;color:var(--m)}@media(max-width:680px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.pass{flex-direction:column}.topin{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div><div class="brand">MIRED CALL EN CASA</div><div class="sub">Creación segura de asesores Call Center</div></div><button class="btn ghost" type="button" onclick="location.href='index.html'">Volver al CRM</button></div></div>
<main class="wrap">
<div class="card">
<h1>Crear asesor Call Center</h1>
<div class="notice">El usuario quedará con rol <b>asesor</b> y grupo comercial <b>Call Center</b>. La contraseña se genera automáticamente.</div>
<div class="grid" style="margin-top:15px">
<label class="full">Nombre y apellidos<input id="nombre" autocomplete="name" placeholder="Nombre completo"></label>
<label>Correo electrónico<input id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com"></label>
<label>Contraseña temporal<div class="pass"><input id="password" type="text" readonly><button class="btn ghost" type="button" onclick="generatePassword()">Generar otra</button></div></label>
<div class="full"><button id="crearBtn" class="btn primary" type="button" onclick="createAdvisor()">➕ Crear usuario Call Center</button></div>
</div>
<div id="msg" class="msg"></div>
<div id="cred" class="cred"><b>✅ Usuario creado correctamente</b><code id="credEmail"></code><code id="credPass"></code><button class="btn ghost" type="button" onclick="copyCredentials()">📋 Copiar credenciales</button></div>
</div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Asesores Call Center</h2><button class="btn ghost" type="button" onclick="loadUsers()">↻ Actualizar</button></div><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Estado</th><th>Creación</th></tr></thead><tbody id="rows"><tr><td colspan="4">Cargando...</td></tr></tbody></table></div></div>
</main>
<script>
const SUPABASE_URL='https://lpiusomsuswdcraoozdn.supabase.co';
const SUPABASE_KEY='sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r';
const CREATE_URL=SUPABASE_URL+'/functions/v1/crear-asesor-v3';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let lastCredentials=null;
const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(text,type='info'){const m=$('msg');m.className='msg show '+type;m.textContent=text}
function generatePassword(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#';const a=new Uint32Array(12);crypto.getRandomValues(a);let p='M';for(const n of a)p+=chars[n%chars.length];$('password').value=p;return p}
async function getSession(){const {data,error}=await client.auth.getSession();if(error)throw error;if(!data?.session?.access_token)throw new Error('La sesión terminó. Vuelve al CRM e ingresa nuevamente.');return data.session}
async function checkAccess(){try{const session=await getSession();const {data,error}=await client.from('perfiles').select('rol').eq('user_id',session.user.id).single();if(error)throw error;if(!data||!['coordinador','administrador'].includes(data.rol))throw new Error('Acceso exclusivo para coordinación.');return true}catch(e){alert(e.message||'No fue posible validar la sesión.');location.href='index.html';return false}}
async function loadUsers(){const rows=$('rows');rows.innerHTML='<tr><td colspan="4">Cargando...</td></tr>';const {data,error}=await client.from('perfiles').select('nombre,email,activo,creado_en').eq('rol','asesor').eq('grupo','callcenter').order('creado_en',{ascending:false});if(error){rows.innerHTML='<tr><td colspan="4">'+escapeHtml(error.message)+'</td></tr>';return}rows.innerHTML=(data||[]).map(x=>'<tr><td><b>'+escapeHtml(x.nombre||'')+'</b></td><td>'+escapeHtml(x.email||'')+'</td><td>'+(x.activo===false?'Desactivado':'Activo')+'</td><td>'+escapeHtml(new Date(x.creado_en).toLocaleString('es-CO'))+'</td></tr>').join('')||'<tr><td colspan="4">Aún no hay asesores Call Center.</td></tr>'}
async function createAdvisor(){const nombre=$('nombre').value.trim();const email=$('email').value.trim().toLowerCase();let password=$('password').value;if(!nombre){show('Escribe el nombre y apellidos del asesor.','error');$('nombre').focus();return}if(!/^\S+@\S+\.\S+$/.test(email)){show('Escribe un correo electrónico válido.','error');$('email').focus();return}if(password.length<8)password=generatePassword();const btn=$('crearBtn');btn.disabled=true;btn.textContent='Creando usuario...';$('cred').classList.remove('show');show('Validando sesión y creando el acceso...','info');try{const session=await getSession();const res=await fetch(CREATE_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify({nombre,email,password,grupo:'callcenter'})});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||('No fue posible crear el usuario. Código '+res.status));if(!data.ok)throw new Error(data.error||'La creación no fue confirmada por el servidor.');lastCredentials={email,password};$('credEmail').textContent='Correo: '+email;$('credPass').textContent='Contraseña temporal: '+password;$('cred').classList.add('show');show('✅ Usuario creado correctamente y asignado al grupo Call Center.','ok');$('nombre').value='';$('email').value='';generatePassword();await loadUsers()}catch(e){console.error(e);show('❌ '+(e.message||'No fue posible crear el usuario.')+'\n\nSi vuelve a aparecer, copia este mensaje completo.','error')}finally{btn.disabled=false;btn.textContent='➕ Crear usuario Call Center'}}
async function copyCredentials(){if(!lastCredentials)return;const t='Usuario CRM MIRED Call Center\nCorreo: '+lastCredentials.email+'\nContraseña temporal: '+lastCredentials.password;try{await navigator.clipboard.writeText(t);show('Credenciales copiadas.','ok')}catch{alert(t)}}
(async()=>{generatePassword();if(await checkAccess())await loadUsers()})();
</script>
</body>
</html>
