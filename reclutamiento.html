<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reclutamiento · MIRED360SERVICIOS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--n:#071a33;--b:#0f7cff;--c:#00b8ff;--bg:#f5f8fc;--l:#dce6f1;--m:#708199}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#132238}header{background:linear-gradient(135deg,var(--n),#0b2d52);color:#fff;padding:24px}.wrap{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:17px;margin-bottom:15px;box-shadow:0 10px 30px #0423420f}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi small{color:var(--m)}.kpi strong{display:block;font-size:28px;margin-top:7px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--b),var(--c));color:white}.ghost{background:white;border:1px solid var(--l)}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd9e7;border-radius:10px;font:inherit}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:10px;border-bottom:1px solid var(--l);font-size:13px;text-align:left}th{background:#f2f7fc}.badge{padding:5px 8px;border-radius:999px;background:#eef6ff;font-weight:700;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:330px}.toolbar select{max-width:220px}.login{max-width:420px;margin:80px auto}.muted{color:var(--m);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><div id="login" class="login card"><h2>MIRED360 · Reclutamiento</h2><p class="muted">Ingresa con tu usuario administrador del CRM.</p><input id="email" type="email" placeholder="Correo"><br><br><input id="pass" type="password" placeholder="Contraseña"><br><br><button class="btn primary" onclick="login()">Ingresar</button><p id="err" class="muted"></p></div>
<div id="app" hidden><header><div style="max-width:1250px;margin:auto"><h1 style="margin:0">Red Comercial 360</h1><p>Reclutamiento, activación y productividad de asesores independientes</p><div class="actions"><a class="btn ghost" href="index.html" style="text-decoration:none;color:#132238">← CRM principal</a><button class="btn ghost" onclick="logout()">Cerrar sesión</button></div></div></header><main class="wrap">
<div class="grid" id="kpis"></div>
<div class="card"><h2>Registrar candidato</h2><div class="form"><input id="nombre" placeholder="Nombre y apellidos"><input id="telefono" placeholder="Celular"><input id="ciudad" placeholder="Ciudad"><select id="experiencia"><option value="">Experiencia comercial</option><option>Sin experiencia</option><option>Menos de 1 año</option><option>1 a 3 años</option><option>Más de 3 años</option></select><input id="vendido" placeholder="¿Qué ha vendido?"><select id="canal"><option value="">Canal preferido</option><option>Calle / TAT</option><option>Redes sociales</option><option>Referidos</option><option>Mixto</option></select><select id="origen"><option>Facebook Ads</option><option>WhatsApp</option><option>Referido</option><option>Orgánico</option><option>Otro</option></select><input id="meta" type="number" min="0" placeholder="Ventas que cree lograr por semana"><textarea class="full" id="notas" placeholder="Observaciones"></textarea><div class="full"><button class="btn primary" onclick="guardar()">Guardar candidato</button></div></div></div>
<div class="card"><div class="toolbar"><input id="buscar" placeholder="Buscar nombre, teléfono o ciudad" oninput="render()"><select id="filtro" onchange="render()"><option value="">Todos los estados</option><option>Nuevo</option><option>Contactado</option><option>Preseleccionado</option><option>En activación</option><option>Asesor activo</option><option>Productor</option><option>Alto productor</option><option>Inactivo</option><option>Descartado</option></select><button class="btn ghost" onclick="cargar()">↻ Actualizar</button></div><div class="table"><table><thead><tr><th>Ingreso</th><th>Candidato</th><th>Ciudad</th><th>Experiencia</th><th>Canal</th><th>Origen</th><th>Estado</th><th>Prospectos</th><th>Instalados</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main></div>
<script>const U='https://lpiusomsuswdcraoozdn.supabase.co',K='sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r',sb=supabase.createClient(U,K);let user=null,data=[];const $=x=>document.getElementById(x),states=['Nuevo','Contactado','Preseleccionado','En activación','Asesor activo','Productor','Alto productor','Inactivo','Descartado'];
async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error){$('err').textContent=r.error.message;return}enter(r.data.user)}
async function logout(){await sb.auth.signOut();location.reload()}async function enter(u){user=u;$('login').hidden=true;$('app').hidden=false;await cargar()}
async function cargar(){let r=await sb.from('reclutamiento_asesores').select('*').order('creado_en',{ascending:false});if(r.error){alert('Falta activar el módulo en Supabase o no hay acceso: '+r.error.message);return}data=r.data||[];render()}
function render(){let q=($('buscar').value||'').toLowerCase(),f=$('filtro').value,a=data.filter(x=>(!f||x.estado===f)&&[x.nombre,x.telefono,x.ciudad].join(' ').toLowerCase().includes(q));let count=s=>data.filter(x=>x.estado===s).length;$('kpis').innerHTML=[['Candidatos',data.length],['En activación',count('En activación')],['Activos',count('Asesor activo')],['Productores',count('Productor')+count('Alto productor')],['Inactivos',count('Inactivo')]].map(x=>'<div class="card kpi"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');$('rows').innerHTML=a.map(x=>'<tr><td>'+String(x.creado_en||'').slice(0,10)+'</td><td><b>'+esc(x.nombre)+'</b><br>'+esc(x.telefono)+'</td><td>'+esc(x.ciudad||'-')+'</td><td>'+esc(x.experiencia||'-')+'</td><td>'+esc(x.canal||'-')+'</td><td>'+esc(x.origen||'-')+'</td><td><select onchange="estado(\''+x.id+'\',this.value)">'+states.map(s=>'<option '+(s===x.estado?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><input style="width:75px" type="number" min="0" value="'+(x.prospectos||0)+'" onchange="metrica(\''+x.id+'\',\'prospectos\',this.value)"></td><td><input style="width:75px" type="number" min="0" value="'+(x.instalados||0)+'" onchange="metrica(\''+x.id+'\',\'instalados\',this.value)"></td><td><button class="btn ghost" onclick="whats(\''+esc(x.telefono)+'\')">WhatsApp</button></td></tr>').join('')||'<tr><td colspan="10">Sin candidatos.</td></tr>'}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function guardar(){let o={user_id:user.id,nombre:$('nombre').value.trim(),telefono:$('telefono').value.trim(),ciudad:$('ciudad').value.trim(),experiencia:$('experiencia').value,vendido:$('vendido').value.trim(),canal:$('canal').value,origen:$('origen').value,meta_semanal:Number($('meta').value||0),notas:$('notas').value.trim(),estado:'Nuevo'};if(!o.nombre||!o.telefono)return alert('Nombre y celular son obligatorios.');let r=await sb.from('reclutamiento_asesores').insert(o);if(r.error)return alert(r.error.message);['nombre','telefono','ciudad','vendido','meta','notas'].forEach(i=>$(i).value='');await cargar()}
async function estado(id,v){let patch={estado:v,actualizado_en:new Date().toISOString()};if(v==='En activación')patch.fecha_activacion=new Date().toISOString();let r=await sb.from('reclutamiento_asesores').update(patch).eq('id',id);if(r.error)alert(r.error.message);await cargar()}
async function metrica(id,c,v){let p={};p[c]=Number(v||0);let r=await sb.from('reclutamiento_asesores').update(p).eq('id',id);if(r.error)alert(r.error.message);await cargar()}
function whats(p){p=String(p).replace(/\D/g,'');if(p.length===10)p='57'+p;window.open('https://wa.me/'+p+'?text='+encodeURIComponent('Hola, te escribimos de MIRED360SERVICIOS para continuar con tu proceso como asesor comercial independiente.'),'_blank')}
(async()=>{let r=await sb.auth.getSession();if(r.data.session?.user)enter(r.data.session.user)})();</script></body></html>
