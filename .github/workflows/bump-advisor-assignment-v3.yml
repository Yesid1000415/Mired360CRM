name: Bump advisor assignment v3
"on":
  push:
    paths:
      - .github/workflows/bump-advisor-assignment-v3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bases-llamadas.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('bases-advisor-assignment.js?v=20260929-2','bases-advisor-assignment.js?v=20260929-3')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bases-llamadas.html
          git diff --cached --quiet || git commit -m "Actualizar etiquetas dinámicas de extensiones"
          git push
