name: Add Excel Pro export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-excel-pro.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          csv_button = '<button class="btn ghost" id="exportBtn">Exportar CSV</button>'
          excel_button = '<button class="btn ghost" type="button" onclick="exportExcelPro()">📊 Exportar Excel Pro (.xlsx)</button>'
          xlsx_script = '<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>'
          pro_script = '<script src="excel-pro.js"></script>'
          if excel_button not in s:
              if csv_button not in s:
                  raise SystemExit('No se encontró el botón Exportar CSV')
              s = s.replace(csv_button, csv_button + ' ' + excel_button, 1)
          if pro_script not in s:
              if xlsx_script not in s:
                  raise SystemExit('No se encontró la librería XLSX')
              s = s.replace(xlsx_script, xlsx_script + '\n' + pro_script, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Excel Pro already installed"
          else
            git commit -m "Agregar Exportar Excel Pro al CRM"
            git push
          fi
