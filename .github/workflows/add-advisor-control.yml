name: Add advisor control to call bases
on:
  push:
    paths:
      - '.github/workflows/add-advisor-control.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete advisor field
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bases-llamadas.html
          git diff --cached --quiet || git commit -m "Completar campo asesor responsable"
          git push
