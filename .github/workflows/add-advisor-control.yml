name: Add advisor control to call bases
on:
  push:
    paths:
      - '.github/workflows/add-advisor-control.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add advisor assignment and labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bases-llamadas.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('.basebar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}', '.basebar{display:grid;grid-template-columns:2fr 1fr 1.3fr 1fr;gap:10px}')

          s=s.replace('<option value="1502000101">101 · Yesid celular</option><option value="1502000102">102 · Usuario 2</option><option value="1502000103">103 · Asesor</option><option value="1502000104">104 · Usuario 4</option><option value="1502000105">105 · Usuario 5</option>', '<option value="1502000101">101 · Asesor</option><option value="1502000102">102 · Asesor</option><option value="1502000103">103 · Asesor</option><option value="1502000104">104 · Asesor</option><option value="1502000105">105 · Asesor</option>')
          s=s.replace('<option value="1502000101">101 · Yesid celular</option><option value="1502000102">102 · Usuario 2</option><option value="1502000103">103 · Computador Yesid</option><option value="1502000104">104 · Usuario 4</option><option value="1502000105">105 · Usuario 5</option>', '<option value="1502000101">101 · Asesor</option><option value="1502000102">102 · Asesor</option><option value="1502000103">103 · Asesor</option><option value="1502000104">104 · Asesor</option><option value="1502000105">105 · Asesor</option>')

          needle='<label>Extensión para llamar<select id="extensionSelect" onchange="saveBaseExtension()"><option value="1502000101">101 · Asesor</option><option value="1502000102">102 · Asesor</option><option value="1502000103">103 · Asesor</option><option value="1502000104">104 · Asesor</option><option value="1502000105">105 · Asesor</option></select></label>'
          advisor=needle+'\n      <label>Asesor responsable<input id="advisorName" placeholder="Nombre del asesor" onchange="saveAdvisorName()"></label>'
          if 'id="advisorName"' not in s:
              s=s.replace(needle, advisor, 1)

          old="$('baseSelect').value=id;$('extensionSelect').value=activeBase.extension||'1502000101';"
          new=old+"$('advisorName').value=activeBase.asesor_nombre||'';"
          s=s.replace(old,new)

          marker="async function saveBaseExtension(){"
          if 'async function saveAdvisorName()' not in s:
              fn="""async function saveAdvisorName(){
  if(!activeBase)return;const asesor_nombre=$('advisorName').value.trim()||null;
  const {error}=await sb.from('bases_llamadas').update({asesor_nombre,actualizado_en:new Date().toISOString()}).eq('id',activeBase.id);
  if(error)return alert('No se pudo guardar el asesor. '+error.message);
  activeBase.asesor_nombre=asesor_nombre;const b=bases.find(x=>x.id===activeBase.id);if(b)b.asesor_nombre=asesor_nombre;
  $('baseStatus').textContent=`${activeBase.nombre} · ${contacts.length} registros · Extensión ${extensionShort(activeBase.extension)}${asesor_nombre?' · Asesor: '+asesor_nombre:''}`;
}

"""
              s=s.replace(marker,fn+marker)

          s=s.replace("$('baseStatus').textContent=`${activeBase.nombre} · ${contacts.length} registros · Extensión ${extensionShort(activeBase.extension)}`;", "$('baseStatus').textContent=`${activeBase.nombre} · ${contacts.length} registros · Extensión ${extensionShort(activeBase.extension)}${activeBase.asesor_nombre?' · Asesor: '+activeBase.asesor_nombre:''}`;")

          s=s.replace("$('baseStatus').textContent=`${activeBase.nombre} · ${contacts.length} registros · Extensión ${extensionShort(activeBase.extension)}`;", "$('baseStatus').textContent=`${activeBase.nombre} · ${contacts.length} registros · Extensión ${extensionShort(activeBase.extension)}${activeBase.asesor_nombre?' · Asesor: '+activeBase.asesor_nombre:''}`;")

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bases-llamadas.html
          git diff --cached --quiet || git commit -m "Agregar control de asesor por base"
          git push
