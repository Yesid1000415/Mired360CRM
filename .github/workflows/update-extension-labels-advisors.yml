name: Update extension labels advisors
on:
  push:
    paths:
      - '.github/workflows/update-extension-labels-advisors.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update extension labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bases-llamadas.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('101 · Yesid celular','101 · Yesid (temporal)')
          s = s.replace('102 · Usuario 2','102 · Asesor 2')
          s = s.replace('103 · Computador Yesid','103 · Asesor 3')
          s = s.replace('104 · Usuario 4','104 · Asesor 4')
          s = s.replace('105 · Usuario 5','105 · Asesor 5')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bases-llamadas.html
          git diff --cached --quiet || git commit -m "Ajustar etiquetas de extensiones para asesores"
          git push
