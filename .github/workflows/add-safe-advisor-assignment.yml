name: Add safe advisor assignment
"on":
  push:
    paths:
      - .github/workflows/add-safe-advisor-assignment.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add advisor assignment script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bases-llamadas.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="bases-advisor-assignment.js?v=20260929-1"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bases-llamadas.html
          git diff --cached --quiet || git commit -m "Activar asignación segura de asesores"
          git push
