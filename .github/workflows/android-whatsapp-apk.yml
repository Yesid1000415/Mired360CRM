name: MIRED360 WhatsApp APK
on:
  workflow_dispatch:
  push:
    branches: [android-whatsapp-build]
    paths:
      - 'android-whatsapp/**'
      - '.github/workflows/android-whatsapp-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIRED360-WhatsApp-APK
          path: android-whatsapp/app/build/outputs/apk/debug/app-debug.apk
