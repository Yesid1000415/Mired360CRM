name: Dedupe Call Center menu
on:
  push:
    paths:
      - '.github/workflows/menu-dedupe-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deduplicate menu and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          user='<button data-view="usuarios">🔐 Crear asesores</button>'
          cc='<button type="button" data-link="callcenter-usuarios.html">👥 Asesores Call Center</button>'
          ac='<button type="button" data-link="academia-callcenter.html">🎓 Academia Call Center</button>'
          # remove every hard-coded copy, then restore exactly one after Crear asesores
          s=s.replace(cc,'').replace(ac,'')
          if user in s:
              s=s.replace(user,user+cc+ac,1)
          # force browsers to request latest excel-pro.js
          s=s.replace('src="excel-pro.js"','src="excel-pro.js?v=20260928d"',1)
          marker='mired-menu-dedupe-runtime'
          if marker not in s:
              runtime='''<script id="mired-menu-dedupe-runtime">\n(function(){\n  function clean(){\n    const nav=document.querySelector('aside nav'); if(!nav)return;\n    ['callcenter-usuarios.html','academia-callcenter.html'].forEach(link=>{\n      const all=[...nav.querySelectorAll(`button[data-link="${link}"]`)];\n      all.slice(1).forEach(x=>x.remove());\n    });\n    const labels=['Asesores Call Center','Academia Call Center'];\n    labels.forEach(label=>{\n      const all=[...nav.querySelectorAll('button')].filter(b=>b.textContent.trim().includes(label));\n      all.slice(1).forEach(x=>x.remove());\n    });\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(clean,900));\n  else setTimeout(clean,900);\n  setTimeout(clean,1800);\n})();\n</script>'''
              s=s.replace('</body>',runtime+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Eliminar definitivamente duplicados Call Center"
          git push
