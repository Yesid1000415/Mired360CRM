name: Agregar acceso rendimiento
on:
  push:
    paths:
      - '.github/workflows/add-rendimiento-menu.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar boton de rendimiento
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<button type="button" data-link="bases-llamadas.html">📞 Bases de llamadas</button>'
          new=old+'<button type="button" data-link="rendimiento.html">🚦 Rendimiento Call Center</button>'
          if 'data-link="rendimiento.html"' not in s:
              if old not in s:
                  raise SystemExit('No se encontro el punto de insercion')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Agregar acceso a rendimiento Call Center'
          git push
