<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rendimiento Call Center · MIRED360</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#071a33;--blue:#0f7cff;--cyan:#00b8ff;--bg:#f5f8fc;--card:#fff;--text:#132238;--muted:#708199;--line:#dce6f1;--green:#16a36a;--yellow:#f59e0b;--red:#e5484d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,select,input{font:inherit}.top{background:linear-gradient(135deg,var(--navy),#0b2d52);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand b{font-size:20px}.brand small{display:block;color:#9bdcff;margin-top:4px}.wrap{max-width:1250px;margin:auto;padding:20px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.ghost{background:#fff;border:1px solid var(--line);color:#17304f}.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 10px 30px rgba(4,35,66,.06);margin-bottom:16px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.header h1{margin:0;font-size:25px}.header p{margin:6px 0 0;color:var(--muted)}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700}.redchip{background:#feecec;color:#a82831}.yellowchip{background:#fff5df;color:#8a5a00}.greenchip{background:#eaf8f1;color:#08774b}.diamondchip{background:#eef0ff;color:#5742b4}.grid{display:grid;gap:12px}.team{grid-template-columns:repeat(5,1fr)}.two{grid-template-columns:1.15fr .85fr}.top3{grid-template-columns:repeat(3,1fr)}.status{border:1px solid var(--line);border-radius:16px;padding:15px}.status.red{background:#fff0f0;border-color:#f0b1b1}.status.yellow{background:#fff7e4;border-color:#f2d38b}.status.green{background:#eaf8f1;border-color:#a7dfc5}.status.diamond{background:linear-gradient(135deg,#eef7ff,#f7efff);border-color:#b7c9ef}.status.gray{background:#f2f5f8;border-color:#d6dee7}.status-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.icon{font-size:28px}.sales{font-size:34px;font-weight:900;margin:7px 0}.muted{color:var(--muted);font-size:12px}.progress{height:9px;background:#dfe8f1;border-radius:999px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--blue);border-radius:999px}.status.diamond .progress span{background:linear-gradient(90deg,var(--blue),#8a5cff)}.prize{border:1px dashed #c9a43d;background:#fffaf0;border-radius:16px;padding:17px}.prize h2{margin:0 0 7px}.rank{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff}.rank.first{background:#fffaf0;border-color:#ead18a}.rank .num{font-size:28px;font-weight:900;margin:5px 0}.section-title{margin:0 0 12px;font-size:19px}.admin{margin-top:11px;padding-top:10px;border-top:1px solid #d8e2ee;display:grid;gap:7px}.admin-row{display:grid;grid-template-columns:1fr 82px;gap:7px}.admin select,.admin input{width:100%;padding:8px;border:1px solid #cfdceb;border-radius:9px}.empty{text-align:center;padding:28px;color:var(--muted)}#loading{min-height:160px;display:grid;place-items:center;color:var(--muted)}
@media(max-width:1100px){.team{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.two,.top3,.team{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.header{flex-direction:column}}
</style>
</head>
<body>
<div class="top"><div class="brand"><b>MIRED<span style="color:#00b8ff">360</span> · Rendimiento Call Center</b><small>Seguimiento mensual de asesores</small></div><button class="btn ghost" onclick="location.href='index.html'">← Volver al CRM</button></div>
<div class="wrap">
  <div class="card">
    <div class="header"><div><h1>🚦 Rendimiento de ventas</h1><p>Meta oficial: <b>15 ventas al mes</b>. El color se calcula según el ritmo del mes.</p></div><button class="btn primary" onclick="loadPerformance()">Actualizar</button></div>
    <div class="legend"><span class="chip redchip">🔴 Necesita impulso</span><span class="chip yellowchip">🟡 En progreso</span><span class="chip greenchip">🟢 Va cumpliendo</span><span class="chip diamondchip">💎 Diamante: supera la meta</span></div>
  </div>
  <div id="loading" class="card">Cargando rendimiento...</div>
  <div id="content" style="display:none"></div>
</div>
<script>
const SUPABASE_URL='https://lpiusomsuswdcraoozdn.supabase.co';
const SUPABASE_KEY='sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const META_DEFAULT=15;
let currentUser=null,currentProfile=null,ranking=[],advisors=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const shortExt=v=>String(v||'').slice(-3);
function stateFor(sales,meta,assigned){
  if(!assigned)return{key:'gray',icon:'⚪',label:'Sin asesor'};
  if(sales>meta)return{key:'diamond',icon:'💎',label:'Diamante'};
  if(sales===meta)return{key:'green',icon:'🟢',label:'Meta cumplida'};
  const d=new Date(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const expected=Math.max(1,meta*(d.getDate()/days)),ratio=sales/expected;
  if(ratio>=1)return{key:'green',icon:'🟢',label:'Va cumpliendo'};
  if(ratio>=.60)return{key:'yellow',icon:'🟡',label:'En progreso'};
  return{key:'red',icon:'🔴',label:'Necesita impulso'};
}
function statusCard(x,title,admin=false){
  const sales=Number(x?.ventas_mes||0),meta=Number(x?.meta_mensual||META_DEFAULT),assigned=!!x?.asesor_user_id,st=stateFor(sales,meta,assigned),pct=Math.min(100,Math.round(sales/meta*100));
  const detail=sales>meta?`Superó la meta por ${sales-meta} venta(s).`:sales===meta?'¡Meta mensual alcanzada!':`Le faltan ${Math.max(0,meta-sales)} venta(s) para la meta.`;
  let controls='';
  if(admin){
    const opts='<option value="">Sin asesor</option>'+advisors.map(a=>`<option value="${a.user_id}" ${a.user_id===x.asesor_user_id?'selected':''}>${esc(a.nombre||a.email)}</option>`).join('');
    controls=`<div class="admin"><div class="muted"><b>Asignación de coordinador</b></div><div class="admin-row"><select id="advisor-${x.extension}">${opts}</select><input id="meta-${x.extension}" type="number" min="1" value="${meta}" title="Meta mensual"></div><button class="btn ghost" onclick="saveAssignment('${x.extension}')">Guardar asignación</button></div>`;
  }
  return `<div class="status ${st.key}"><div class="status-top"><div><b>${esc(title)}</b><div class="muted">${esc(x?.asesor_nombre||'Sin asesor asignado')} · Ext. ${shortExt(x?.extension)}</div></div><div class="icon">${st.icon}</div></div><div class="sales">${sales} <span class="muted">ventas</span></div><b>${esc(st.label)}</b><div class="muted">${detail} Meta: ${meta}</div><div class="progress"><span style="width:${pct}%"></span></div>${controls}</div>`;
}
function top3Html(){
  const rows=ranking.filter(x=>x.asesor_user_id).sort((a,b)=>Number(b.ventas_mes)-Number(a.ventas_mes)||String(a.asesor_nombre||'').localeCompare(String(b.asesor_nombre||''))).slice(0,3),med=['🥇','🥈','🥉'];
  if(!rows.length)return '<div class="empty">Aún no hay asesores asignados.</div>';
  return rows.map((x,i)=>`<div class="rank ${i===0?'first':''}"><b>${med[i]} ${esc(x.asesor_nombre||('Extensión '+shortExt(x.extension)))}</b><div class="num">${Number(x.ventas_mes||0)}</div><div class="muted">ventas · Ext. ${shortExt(x.extension)}</div></div>`).join('');
}
function prizeText(){
  const rows=ranking.filter(x=>x.asesor_user_id).sort((a,b)=>Number(b.ventas_mes)-Number(a.ventas_mes));
  const leader=rows[0];
  if(leader && Number(leader.ventas_mes)>Number(leader.meta_mensual||META_DEFAULT))return `Actualmente lidera <b>${esc(leader.asesor_nombre||'')}</b> con <b>${Number(leader.ventas_mes)} ventas</b>.`;
  return 'El premio se activa para quien cierre el mes con más ventas y haya superado la meta de 15.';
}
async function saveAssignment(extension){
  const sel=document.getElementById('advisor-'+extension),metaEl=document.getElementById('meta-'+extension);if(!sel||!metaEl)return;
  const userId=sel.value||null,meta=Math.max(1,Number(metaEl.value||META_DEFAULT)),advisor=advisors.find(a=>a.user_id===userId)||null;
  const patch={asesor_user_id:userId,asesor_nombre:advisor?.nombre||null,meta_mensual:meta,actualizado_en:new Date().toISOString()};
  const {error}=await sb.from('callcenter_extensiones').update(patch).eq('extension',extension);
  if(error)return alert('No se pudo guardar la asignación. '+error.message);
  await sb.from('bases_llamadas').update({asesor_user_id:userId,asesor_nombre:advisor?.nombre||null,actualizado_en:new Date().toISOString()}).eq('extension',extension);
  await loadPerformance();alert('Extensión '+shortExt(extension)+' actualizada correctamente.');
}
async function loadPerformance(){
  const loading=document.getElementById('loading'),content=document.getElementById('content');loading.style.display='grid';content.style.display='none';
  try{
    const {data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='index.html';return}currentUser=session.user;
    const [{data:profile,error:pError},{data:rows,error:rError}]=await Promise.all([
      sb.from('perfiles').select('user_id,nombre,email,rol').eq('user_id',currentUser.id).maybeSingle(),
      sb.rpc('callcenter_ranking_mes')
    ]);
    if(pError)throw pError;if(rError)throw rError;currentProfile=profile||null;ranking=rows||[];
    const isCoord=['coordinador','admin'].includes(String(currentProfile?.rol||'').toLowerCase());
    if(isCoord){const {data,error}=await sb.from('perfiles').select('user_id,nombre,email,rol').eq('rol','asesor').order('nombre');if(error)throw error;advisors=data||[]}
    const own=ranking.find(x=>x.asesor_user_id===currentUser.id)||null;
    let html='';
    if(isCoord){
      html+=`<div class="card prize"><h2>🏆 Premio Sorpresa MIRED360</h2><div>El asesor con más ventas del mes, habiendo superado la meta, recibe un premio sorpresa.</div><div class="muted" style="margin-top:6px">${prizeText()}</div></div>`;
      html+=`<div class="card"><h2 class="section-title">Equipo de 5 extensiones</h2><div class="grid team">${ranking.map(x=>statusCard(x,'Extensión '+shortExt(x.extension),true)).join('')}</div></div>`;
    }else{
      html+=`<div class="grid two"><div class="card">${own?statusCard(own,'Mi rendimiento'):'<div class="empty">Aún no tienes una extensión asignada. El coordinador debe asignártela.</div>'}</div><div class="card prize"><h2>🏆 Premio Sorpresa MIRED360</h2><b>Supera la meta y busca el primer lugar.</b><div class="muted" style="margin-top:8px">${prizeText()}</div><div class="muted" style="margin-top:8px">El premio puede ser un bono, una entrada a cine, un detalle u otra sorpresa.</div></div></div>`;
    }
    html+=`<div class="card"><h2 class="section-title">🏁 Top 3 del mes</h2><div class="grid top3">${top3Html()}</div></div>`;
    content.innerHTML=html;loading.style.display='none';content.style.display='block';
  }catch(e){loading.innerHTML='<div class="empty">No se pudo cargar el rendimiento. '+esc(e.message||e)+'</div>'}
}
loadPerformance();
</script>
</body>
</html>
